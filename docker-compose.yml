services:
  nginx_prod:
    build: .
    container_name: gpt4ct_nginx
    restart: unless-stopped
    ports:
      - "5000:80"

  server:
    build: ./server
    container_name: gpt4ct_server
    restart: unless-stopped
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=password
      - DB_NAME=postgres
    env_file:
      - .env

  db:
    build: ./db
    container_name: gpt4ct_db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: password
    volumes:
      - gpt4ct_db_data:/var/lib/postgresql/data

volumes:
  gpt4ct_db_data:
